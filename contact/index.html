.about-reference-layout::before,
.about-reference-layout::after,
.about-reference-layout .about-hero::before,
.about-reference-layout .about-hero::after { display: none !important; }
.about-reference-layout .about-ref-container { width: min(calc(100% - 10rem), 1100px); margin-inline: auto; }
.about-reference-layout h1,
.about-reference-layout h2,
.about-reference-layout h3,
.about-reference-layout p { margin: 0; }
.about-reference-layout em { color: var(--about-cyan); font-style: normal; }
.about-reference-layout .about-cinema-hero { min-height: 460px !important; padding: clamp(4.75rem, 7vw, 6.6rem) 0 3.3rem !important; border: 0 !important; border-bottom: 1px solid rgba(111,238,226,.19) !important; background: transparent !important; }
.about-reference-layout .about-hero-grid { display: grid; grid-template-columns: minmax(0,530px) minmax(170px,1fr); gap: 6vw; align-items: start; }
.about-reference-layout .about-cinema-copy { max-width: 530px; }
.about-reference-layout h1 { max-width: 15.5ch !important; color: #f1fbf9 !important; font-size: clamp(2.05rem,4.2vw,3.5rem) !important; font-weight: 400 !important; letter-spacing: -.045em !important; line-height: 1.05 !important; }
.about-reference-layout h1 > span,
.about-reference-layout .about-ref-philosophy h2 > span { display: block; white-space: nowrap; }
.about-reference-layout .about-cinema-copy > p:not(.about-principle-line) { max-width: 450px; margin-top: 1.15rem; color: rgba(231,246,242,.86); font-size: clamp(.88rem,1.05vw,1.05rem); line-height: 1.5; }
.about-reference-layout .about-principle-line { margin-top: 2rem !important; color: rgba(73,232,219,.93) !important; font-size: .63rem !important; font-weight: 700; letter-spacing: .22em; line-height: 1.65 !important; text-transform: uppercase; }
.about-reference-layout .about-hero-note { justify-self: end; width: min(100%,205px); margin-top: 1.5rem; color: rgba(220,243,240,.8); }
.about-reference-layout .about-hero-note span { display: block; width: 32px; height: 1px; margin-bottom: 1rem; background: var(--about-cyan); }
.about-reference-layout .about-hero-note p { font-size: .63rem; font-weight: 700; letter-spacing: .23em; line-height: 1.65; text-transform: uppercase; }
.about-reference-layout .about-ref-section { min-height: 300px; padding: 3.3rem 0 !important; border: 0 !important; background: transparent !important; }
.about-reference-layout .about-ref-split { display: grid; grid-template-columns: minmax(250px,.9fr) minmax(0,1fr); gap: clamp(3rem,8vw,7rem); align-items: start; }
.about-reference-layout .about-ref-split h2,
.about-reference-layout .about-direction-grid > h2 { max-width: 11ch; color: #f0fbf8 !important; font-size: clamp(1.8rem,3vw,2.6rem) !important; font-weight: 400 !important; letter-spacing: -.045em !important; line-height: 1.1 !important; }
